  #sport-loading .sl-logo {
    width: min(190px, 52vw); height: auto;
  }
  #sport-loading .sl-spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid rgba(139, 111, 92, 0.22);
    border-top-color: #8b6f5c;
    /* Repli CSS (compositeur). Renforcé par une animation Web Animations créée
       AVANT le JS de l'app (script inline ci-dessous) → gagne la course au commit
       et tourne sans accroc même sur les machines rapides. */
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
    animation: sl-spin 0.7s linear infinite;
  }
  @keyframes sl-spin { to { transform: translateZ(0) rotate(360deg); } }
  #sport-loading .sl-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: #8b6f5c;
    font-family: 'Space Mono', ui-monospace, monospace;
  }
  #sport-loading.sl-out { opacity: 0; pointer-events: none; }
  @media (prefers-color-scheme: dark) {
    #sport-loading { background: #17140f; }
    #sport-loading .sl-spinner { border-color: rgba(200, 162, 122, 0.25); border-top-color: #c8a27a; }
    #sport-loading .sl-label { color: #c8a27a; }
  }
</style>
<script>
  /* Crée l'animation via Web Animations API pendant le PARSING du HTML (avant les
     modules différés de l'app) : la rotation est enregistrée sur le compositeur
     tôt et déterministe, donc l'anneau tourne même si l'app bloque le thread juste
     après (cas des machines rapides où l'animation CSS n'a pas le temps d'être
     « committée »). Repli sur l'animation CSS si l'API n'existe pas. */
  (function () {
    /* Sortir l'écran de la racine Nuxt, et noter l'heure.

       Le gabarit est rendu DANS la racine de l'application, que le montage de Vue
       remplace : sans ce déplacement, l'écran disparaît à l'octet près où l'app est
       prête — soit un flash de quelques dizaines de millisecondes sur un
       rechargement à chaud. Déplacé sous <body>, plus personne ne le remplace, et
       c'est `retirerEcranChargement()` qui décide de son départ.

       Ici, pendant l'analyse du HTML : plus tard serait trop tard. */
    window.__slDebut = Date.now();
    var ecran = document.getElementById('sport-loading');
    if (ecran && document.body && ecran.parentNode !== document.body) {
      try { document.body.appendChild(ecran); } catch (e) { /* on le laisse où il est */ }
    }

    var el = document.getElementById('sl-spinner');
    if (el && typeof el.animate === 'function') {
      try {
        el.style.animation = 'none'; // évite le doublon avec l'anim CSS
        el.animate(
          [{ transform: 'translateZ(0) rotate(0deg)' }, { transform: 'translateZ(0) rotate(360deg)' }],
          { duration: 700, iterations: Infinity, easing: 'linear' }
        );
      } catch (e) { el.style.animation = ''; }
    }
  })();
</script>
